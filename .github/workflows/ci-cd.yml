name: LexIntellectus CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  POSTGRES_USER: lexintellectus
  POSTGRES_PASSWORD: lexintellectus_ci_password
  POSTGRES_DB: lexintellectus
  REDIS_PASSWORD: lexintellectus_ci_redis
  JWT_SECRET_KEY: ci_jwt_secret_key_for_automated_testing_only
  STRIPE_SECRET_KEY: mock_stripe_secret_key_for_testing_only

jobs:
  backend-tests:
    name: Backend — Alembic Migrations & Pytest (53 Tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lexintellectus
          POSTGRES_PASSWORD: lexintellectus_ci_password
          POSTGRES_DB: lexintellectus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lexintellectus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libpq-dev postgresql-client

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare PostgreSQL databases & extensions
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: |
          psql -h localhost -U ${{ env.POSTGRES_USER }} -d postgres -c "CREATE DATABASE lexintellectus_test;" || true
          psql -h localhost -U ${{ env.POSTGRES_USER }} -d lexintellectus -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          psql -h localhost -U ${{ env.POSTGRES_USER }} -d lexintellectus_test -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Run Pytest Automated Suite
        working-directory: backend
        env:
          PYTHONPATH: .
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: lexintellectus_test
          DATABASE_URL: postgresql+asyncpg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/lexintellectus_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest -v

  frontend-build:
    name: Frontend — Next.js 14 Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build Next.js production bundle
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: /api/v1
          BACKEND_INTERNAL_URL: http://backend:8000
        run: npm run build

  production-compose-validate:
    name: Production — Validate Docker Compose & Nginx Config
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.prod.yml syntax
        env:
          POSTGRES_PASSWORD: prod_validation_password
          REDIS_PASSWORD: prod_validation_redis
          MINIO_ROOT_PASSWORD: prod_validation_minio
          JWT_SECRET_KEY: prod_validation_jwt_secret
          GOOGLE_API_KEY: prod_validation_google_key
        run: |
          docker compose -f docker-compose.prod.yml config -q
